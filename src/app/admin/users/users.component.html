<div class="mb-6 p-4 bg-gray-100 rounded-lg shadow-md">
    <h3 class="text-xl font-semibold mb-4">Add New Admin User</h3>
    <form (ngSubmit)="onSubmit()" #userForm="ngForm">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
          <input 
            type="text" 
            id="username" 
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="newUser.username" 
            name="username" 
            required />
        </div>
  
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input 
            type="email" 
            id="email" 
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="newUser.email" 
            name="email" />
        </div>
  
        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input 
            type="password" 
            id="password" 
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="newUser.password" 
            name="password" 
            required />
        </div>
  
        <!-- Role Selection -->
        <div>
            <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
            <input 
              id="role" 
              type="text" 
              value="Admin" 
              disabled 
              class="mt-1 block w-full px-3 py-2 bg-gray-200 text-gray-700 border border-gray-300 rounded-md shadow-sm cursor-not-allowed"
            />
          </div>
  
        <!-- Submit Button -->
        <div class="col-span-2 flex justify-end">
          <button 
            type="submit" 
            [disabled]="!userForm.form.valid"
            class="bg-blue-500 text-white px-6 py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            Add User
          </button>
          <button 
            type="button" 
            (click)="resetForm()"
            class="ml-4 bg-gray-500 text-white px-6 py-2 rounded-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500"
          >
            Cancel
          </button>
        </div>
      </div>
    </form>
  </div>
  




<div class="p-6">
    <h1 class="text-2xl font-bold">User Management</h1>

    <!-- User Table -->
    <table class="w-full border-collapse border border-gray-300 mt-4">
      <thead>
        <tr class="bg-gray-100 text-left">
          <th class="py-2 px-4 border-b">ID</th>
          <th class="py-2 px-4 border-b">Name</th>
          <th class="py-2 px-4 border-b">Email</th>
          <th class="py-2 px-4 border-b">Role</th>
          <th class="py-2 px-4 border-b">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td class="py-2 px-4 border-b">{{ user.id }}</td>
          <td class="py-2 px-4 border-b">{{ user.username }}</td>
          <td class="py-2 px-4 border-b">{{ user.email || 'No email provided' }}</td>
          <td class="py-2 px-4 border-b">
            {{ user.role.name  }}
          </td>
          <td class="py-2 px-4 border-b">
            <button 
            (click)="deleteUser(user.id)"
            class="bg-red-500 text-white px-2 py-1 rounded">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
