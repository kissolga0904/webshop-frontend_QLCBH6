<div class="container mx-auto px-6 py-4">
    <h2 class="text-2xl font-bold mb-4">Product Management</h2>
  
    <!-- Add / Edit Product Form -->
    <div class="mb-6 p-4 bg-gray-100 rounded-lg shadow-md">
      <h3 class="text-xl font-semibold mb-4">{{ isEditing ? 'Edit Product' : 'Add New Product' }}</h3>
      <form (ngSubmit)="onSubmit()" #productForm="ngForm">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
            <input 
              type="text" 
              id="name" 
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              [(ngModel)]="newProduct.name" 
              name="name" 
              required />
          </div>
          <div>
            <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
            <input 
              type="text" 
              id="description" 
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              [(ngModel)]="newProduct.description" 
              name="description" 
              required />
          </div>
          <div>
            <label for="price" class="block text-sm font-medium text-gray-700">Price</label>
            <input 
              type="number" 
              id="price" 
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              [(ngModel)]="newProduct.price" 
              name="price" 
              required />
          </div>
          <div>
            <label for="quantity" class="block text-sm font-medium text-gray-700">Quantity</label>
            <input 
              type="number" 
              id="quantity" 
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              [(ngModel)]="newProduct.quantity" 
              name="quantity" 
              required 
              min="0"
            />
          </div>
          <div>
            <label for="file" class="block text-sm font-medium text-gray-700">Product Image</label>
            <input 
              type="file" 
              id="file" 
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              (change)="onFileChange($event)" 
              name="file"
              [required]="!isEditing" />
          </div>
          <div class="col-span-2 flex justify-end">
            <button 
              type="submit" 
              [disabled]="!productForm.form.valid || (!selectedFile && !isEditing)" 
              class="bg-blue-500 text-white px-6 py-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              {{ isEditing ? 'Save Changes' : 'Add Product' }}
            </button>
            <button 
              type="button" 
              (click)="resetForm()"
              class="ml-4 bg-gray-500 text-white px-6 py-2 rounded-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500"
            >
              Cancel
            </button>
          </div>
        </div>
      </form>
    </div>
  
    <!-- Product Table -->
    <table class="min-w-full bg-white border border-gray-300 rounded-lg shadow-md">
      <thead>
        <tr class="bg-gray-100 text-left">
          <th class="py-2 px-4 border-b">Name</th>
          <th class="py-2 px-4 border-b">Description</th>
          <th class="py-2 px-4 border-b">Price</th>
          <th class="py-2 px-4 border-b">Quantity</th>
          <th class="py-2 px-4 border-b">Image</th>
          <th class="py-2 px-4 border-b">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td class="py-2 px-4 border-b">{{ product.name }}</td>
          <td class="py-2 px-4 border-b">{{ product.description }}</td>
          <td class="py-2 px-4 border-b">{{ product.price }}</td>
          <td class="py-2 px-4 border-b">{{ product.quantity }}</td>
          <td class="py-2 px-4 border-b">
            <img *ngIf="product.filename" [src]="'http://localhost:8080/images/' + product.filename" alt="{{ product.name }}" class="w-16 h-16 object-cover rounded">
          </td>
          <td class="py-2 px-4 border-b space-x-2">
            <button (click)="editProduct(product)" class="bg-yellow-500 text-white px-4 py-2 rounded-md hover:bg-yellow-600">Edit</button>
            <button (click)="deleteProduct(product)" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
</div>
