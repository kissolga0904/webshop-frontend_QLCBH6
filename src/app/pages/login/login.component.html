<div class="font-[sans-serif] max-w-7xl mx-auto h-screen">

          <h3 class="text-[#1C408A] text-4xl font-bold">Sign in</h3>
        </div>

        <div>
          <label class="text-gray-800 text-[15px] mb-2 block">Email</label>
          <div class="relative flex items-center">
            <input name="email" type="text" required class="w-full text-sm text-gray-800 bg-gray-100 focus:bg-transparent pl-4 pr-10 py-3 rounded-md border border-gray-100 focus:border-blue-600 outline-none transition-all" placeholder="Enter email" />
            <svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-[18px] h-[18px] absolute right-4" viewBox="0 0 682.667 682.667">
              <defs>
                <clipPath id="a" clipPathUnits="userSpaceOnUse">
                  <path d="M0 512h512V0H0Z" data-original="#000000"></path>
                </clipPath>
              </defs>
              <g clip-path="url(#a)" transform="matrix(1.33 0 0 -1.33 0 682.667)">
                <path fill="none" stroke-miterlimit="10" stroke-width="40" d="M452 444H60c-22.091 0-40-17.909-40-40v-39.446l212.127-157.782c14.17-10.54 33.576-10.54 47.746 0L492 364.554V404c0 22.091-17.909 40-40 40Z" data-original="#000000"></path>
                <path d="M472 274.9V107.999c0-11.027-8.972-20-20-20H60c-11.028 0-20 8.973-20 20V274.9L0 304.652V107.999c0-33.084 26.916-60 60-60h392c33.084 0 60 26.916 60 60v196.653Z" data-original="#000000"></path>
              </g>
            </svg>
          </div>
        </div>

        <div class="mt-4">
          <label class="text-gray-800 text-[15px] mb-2 block">Password</label>
            <input name="password" type="password" class="bg-gray-100 w-full text-gray-800 text-sm px-4 py-2.5 rounded-md border focus:bg-transparent focus:border-black outline-none transition-all" placeholder="Enter password" />
        </div>

        <div class="flex flex-wrap items-center gap-4 justify-between mt-4">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox" class="shrink-0 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded-md" />
            <label for="remember-me" class="ml-3 block text-sm text-gray-800">
              Remember me
            </label>
          </div>
          <div class="text-sm">
            <a href="jajvascript:void(0);" class="text-[#1C408A] font-semibold hover:underline">
              Forgot your password?
            </a>
          </div>
        </div>

        <div class="mt-8">
          <button type="button" class="w-full shadow-xl py-2.5 px-4 text-sm tracking-wide font-semibold rounded-md text-white bg-[#1C408A] hover:bg-blue-700 focus:outline-none">
            Log in
          </button>
        </div>
        <p class="text-sm mt-8 text-center text-gray-500">Don't have an account? <a href="/register" class="text-[#1C408A] font-semibold tracking-wide hover:underline ml-1">Register here</a></p>
      </form>

      <div class="h-full md:py-6 flex items-center relative max-md:before:hidden before:absolute before:bg-gradient-to-r before:from-sky-200 before:via-[#51b2d6] before:to-[#1C408A] before:h-full before:w-3/4 before:right-0 before:z-0">
        <img src="https://images.unsplash.com/photo-1565382778766-f1e68c4fbcc7?q=80&w=1887&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="rounded-md lg:w-4/5 md:w-11/12 z-50 relative" alt="Dining Experience" />
      </div>
